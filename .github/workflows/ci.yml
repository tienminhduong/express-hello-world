name: DevOps

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Build with docker
        run: |
          echo "Building Docker container..."
          docker build -t express-hello-world .
  
  run:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Run Docker container
        run: |
          echo "Running Docker container..."
          docker run -d -p 3001:3001 --name express-hello-world express-hello-world
          echo "Container is running on port 3001"